<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator</title>
  <meta name="description" content="Interactive scientific calculator built with HTML, CSS Grid, and JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calc-wrapper">
    <h1 class="calc-title">Scientific Calculator</h1>
    <div class="calculator" id="calculator">
      <!-- Display -->
      <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </div>

      <!-- Buttons Grid -->
      <div class="btn-grid">
        <!-- Row 1: Functions -->
        <button class="btn fn" id="btn-sin"  data-action="sin">sin</button>
        <button class="btn fn" id="btn-cos"  data-action="cos">cos</button>
        <button class="btn fn" id="btn-tan"  data-action="tan">tan</button>
        <button class="btn fn" id="btn-log"  data-action="log">log</button>
        <button class="btn fn" id="btn-ln"   data-action="ln">ln</button>

        <!-- Row 2: Math ops -->
        <button class="btn fn" id="btn-sqrt" data-action="sqrt">√</button>
        <button class="btn fn" id="btn-pow"  data-action="pow">xʸ</button>
        <button class="btn fn" id="btn-pi"   data-action="pi">π</button>
        <button class="btn fn" id="btn-e"    data-action="euler">e</button>
        <button class="btn fn" id="btn-paren"data-action="paren">( )</button>

        <!-- Row 3 -->
        <button class="btn clear" id="btn-ac"  data-action="ac">AC</button>
        <button class="btn clear" id="btn-del" data-action="del">⌫</button>
        <button class="btn op"    id="btn-pct" data-action="percent">%</button>
        <button class="btn op"    id="btn-div" data-action="op" data-val="/">÷</button>

        <!-- Row 4 -->
        <button class="btn num" id="btn-7" data-action="num" data-val="7">7</button>
        <button class="btn num" id="btn-8" data-action="num" data-val="8">8</button>
        <button class="btn num" id="btn-9" data-action="num" data-val="9">9</button>
        <button class="btn op"  id="btn-mul" data-action="op" data-val="*">×</button>

        <!-- Row 5 -->
        <button class="btn num" id="btn-4" data-action="num" data-val="4">4</button>
        <button class="btn num" id="btn-5" data-action="num" data-val="5">5</button>
        <button class="btn num" id="btn-6" data-action="num" data-val="6">6</button>
        <button class="btn op"  id="btn-sub" data-action="op" data-val="-">−</button>

        <!-- Row 6 -->
        <button class="btn num" id="btn-1" data-action="num" data-val="1">1</button>
        <button class="btn num" id="btn-2" data-action="num" data-val="2">2</button>
        <button class="btn num" id="btn-3" data-action="num" data-val="3">3</button>
        <button class="btn op"  id="btn-add" data-action="op" data-val="+">+</button>

        <!-- Row 7 -->
        <button class="btn num" id="btn-sign" data-action="sign">±</button>
        <button class="btn num" id="btn-0"    data-action="num" data-val="0">0</button>
        <button class="btn num" id="btn-dot"  data-action="dot">.</button>
        <button class="btn eq"  id="btn-eq"   data-action="eq">=</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
