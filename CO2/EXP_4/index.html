<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Result Analysis System</title>
  <meta name="description" content="Analyze student results, grades, and statistics with this interactive system." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Student Result Analysis</h1>
      <p>Enter marks for each subject to compute grades and statistics</p>
    </header>

    <!-- Input Section -->
    <section class="input-section">
      <div class="subject-inputs" id="subjectInputs">
        <!-- Generated by JS -->
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="analyzeBtn" onclick="analyzeResults()">Analyse Results</button>
        <button class="btn-secondary" id="resetBtn" onclick="resetAll()">Reset</button>
      </div>
    </section>

    <!-- Results Table -->
    <section class="results-section" id="resultsSection" style="display:none">
      <h2>Result Sheet</h2>
      <div class="table-wrapper">
        <table id="resultTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Subject</th>
              <th>Max Marks</th>
              <th>Marks Obtained</th>
              <th>Percentage</th>
              <th>Grade</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

      <!-- Statistics Cards -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Performance Bar -->
      <div class="perf-section">
        <h3>Subject-wise Performance</h3>
        <div class="perf-bars" id="perfBars"></div>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
