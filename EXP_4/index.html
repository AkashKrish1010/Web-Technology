<!DOCTYPE html>
<html lang="en">

<head>
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page-wrapper">
    <div class="form-container">
      <div class="form-header">
        <div class="header-icon">🎓</div>
        <h1>Student Registration Form</h1>
        <p class="form-subtitle">Fill in the details below to complete your enrollment</p>
      </div>

      <form action="#" method="post" class="registration-form">

        <!-- Student Name -->
        <div class="form-group">
          <label for="studentName">Student Name</label>
          <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>

        <!-- Date of Birth -->
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob">
        </div>

        <!-- Gender -->
        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="male" name="gender" value="Male">
              <label for="male">Male</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="female" name="gender" value="Female">
              <label for="female">Female</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="other" name="gender" value="Other">
              <label for="other">Other</label>
            </div>
          </div>
        </div>

        <!-- Select Course -->
        <div class="form-group">
          <label for="course">Select Course</label>
          <select id="course" name="course">
            <option value="">-- Select Course --</option>
            <option value="CSE">Computer Science Engineering</option>
            <option value="ECE">Electronics and Communication Engineering</option>
            <option value="EEE">Electrical and Electronics Engineering</option>
            <option value="MECH">Mechanical Engineering</option>
          </select>
        </div>

        <!-- Address -->
        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" name="address" rows="4" placeholder="Enter your full address"></textarea>
        </div>

        <!-- Upload Photograph -->
        <div class="form-group">
          <label for="photo">Upload Photograph</label>
          <div class="file-upload-wrapper">
            <input type="file" id="photo" name="photo" accept="image/*">
            <div class="file-upload-label">
              <span class="upload-icon">📷</span>
              <span class="upload-text">Choose a photo...</span>
            </div>
          </div>
        </div>

        <!-- Declaration Checkbox -->
        <div class="form-group checkbox-group">
          <input type="checkbox" id="declaration" name="declaration" required>
          <label for="declaration">
            I confirm that the above information is correct and complete.
          </label>
        </div>

        <!-- Buttons -->
        <div class="button-group">
          <button type="submit" class="btn btn-primary">Register</button>
          <button type="reset" class="btn btn-secondary">Clear</button>
        </div>

      </form>
    </div>
  </div>

</body>

</html>
